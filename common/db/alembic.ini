# Alembic-Konfiguration. Die DB-URL kommt aus common.config (MYSQL_* bzw. DB_URL).
# CLI (aus dem Repo-Root):  alembic -c common/db/alembic.ini upgrade head
# Im Betrieb führt das Backend beim Start "upgrade head" selbst aus.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
